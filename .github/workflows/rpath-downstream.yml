name: RPATH downstream comparison (one-time validation)
on:
  push:
    branches: [rpath-regression-tests]
  workflow_dispatch:
    inputs:
      project:
        description: Project to validate (all runs all enabled projects)
        type: choice
        default: all
        options: [all, numpy, vapoursynth, dwave-optimization]
      repair:
        description: Also inspect and test repaired wheels
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  downstream:
    name: Downstream / ${{ matrix.project }} / ${{ matrix.os }} / main + PR + Astra
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        project:
          - numpy
          # GridFire takes about an hour for three backends and still times out
          # on Linux; macOS builds expose an unrelated fourdst import failure.
          # Revisit during final validation, or ask its author to check the PR.
          # - gridfire
          - vapoursynth
          - dwave-optimization
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        if: github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project
        with:
          pixi-version: v0.77.1
          manifest-path: tools/rpath-validation/pixi.toml
          cache: false
      - name: Test validation harness
        if: github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project
        run: |
          mkdir -p reports
          pixi run --manifest-path tools/rpath-validation/pixi.toml python -m pytest \
          tools/rpath-validation/test_commands.py tools/rpath-validation/test_paths.py \
          --basetemp=reports/harness-tests -q
      - name: Compare backends with one dependency lock (25-minute budget each)
        if: github.event_name == 'push' || inputs.project == 'all' || inputs.project == matrix.project
        env:
          PROJECT: ${{ matrix.project }}
          REPAIR: ${{ inputs.repair }}
        run: |
          result=0
          repair_args=()
          if [ "$REPAIR" = true ]; then repair_args+=(--repair); fi
          mkdir -p reports
          for revision in \
            cbe2ac407957ac0d8b0c5365a02d21dcade12822 \
            ddfcd049d0dfca8821195af396aa45afaa156948 \
            722f285c396d4c38dedb198a2c6a6c23b85bf591; do
            # Fetch explicitly: a backend may live outside the suite's history.
            if ! git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=60 fetch --no-tags --depth=1 origin "$revision"; then
              echo "::error::Cannot fetch backend ${revision}; publish its branch before rerunning."
              result=1
              continue
            fi
            git worktree add --detach "${RUNNER_TEMP}/backend-${revision}" "$revision"
            pixi run --manifest-path tools/rpath-validation/pixi.toml python tools/rpath-validation/run.py "$PROJECT" \
              --backend "${RUNNER_TEMP}/backend-${revision}" \
              --output "${GITHUB_WORKSPACE}/reports/${revision}" \
              --lock "${GITHUB_WORKSPACE}/reports/dependencies.lock" \
              --timeout 1500 --build-timeout 1200 --command-timeout 300 \
              "${repair_args[@]}" || result=1
          done
          exit "$result"
        shell: bash
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: downstream-${{ matrix.project }}-${{ matrix.os }}
          path: |
            reports/**/report.json
            reports/**/commands.json
            reports/**/logs/*.log
            reports/**/source*/build-rpath/meson-logs/**
            reports/**/source*/build-rpath/compile_commands.json
            reports/dependencies.lock
            reports/**/wheels/*.whl
            reports/**/repaired/*.whl
            tools/rpath-validation/pixi.lock
