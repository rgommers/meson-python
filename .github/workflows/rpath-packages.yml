name: RPATH package comparison (one-time validation)
on:
  push:
    branches: [rpath-regression-tests]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel]
        # checkout needs complete commit IDs; abbreviated IDs are treated as refs.
        backend:
          - cbe2ac407957ac0d8b0c5365a02d21dcade12822 # main
          - 2a2a7aea39536fdb91f4bd6fb2456400a08ab6cb # PR rewrite
          - 722f285c396d4c38dedb198a2c6a6c23b85bf591 # rpath-fixes-astra; publish before running
        # 1.9 exercises all RPATH cases; 1.12 covers the current release series.
        # Run older versions once more during the final compatibility review.
        meson: ['~=1.9.0', '~=1.12.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: suite
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.backend }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencies
        env:
          MESON_SPEC: ${{ matrix.meson }}
        run: |
          python -m pip install ./backend build pytest wheel ninja "meson${MESON_SPEC}"
          if [ "$RUNNER_OS" = Linux ]; then
            python -m pip install patchelf
            sudo apt-get update
            sudo apt-get install -y binutils pkg-config
          else
            brew install pkgconf
          fi
      - name: Compare package behavior
        working-directory: suite
        env:
          MESONPY_RPATH_BACKEND: ${{ github.workspace }}/backend
          MESONPY_RPATH_REPORT_DIR: ${{ github.workspace }}/reports
        run: |
          mkdir -p "$MESONPY_RPATH_REPORT_DIR"
          python -m pip freeze > "$MESONPY_RPATH_REPORT_DIR/dependencies.txt"
          cc --version > "$MESONPY_RPATH_REPORT_DIR/compiler.txt"
          python -m pytest tests/test_rpath_packages.py -vv --basetemp="${RUNNER_TEMP}/rpath-cases"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rpath-${{ matrix.os }}-${{ matrix.backend }}-${{ strategy.job-index }}
          path: |
            reports
            ${{ runner.temp }}/rpath-cases/**/wheels/*.whl

  conda-packages:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # checkout needs complete commit IDs; abbreviated IDs are treated as refs.
        backend:
          - cbe2ac407957ac0d8b0c5365a02d21dcade12822 # main
          - 2a2a7aea39536fdb91f4bd6fb2456400a08ab6cb # PR rewrite
          - 722f285c396d4c38dedb198a2c6a6c23b85bf591 # rpath-fixes-astra; publish before running
    steps:
      - uses: actions/checkout@v7
        with:
          path: suite
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.backend }}
          path: backend
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.77.1
          manifest-path: suite/.github/workflows/pixi.toml
          cache: false
      - name: Compare with compiler-injected RPATH
        working-directory: suite
        env:
          MESONPY_RPATH_BACKEND: ${{ github.workspace }}/backend
          MESONPY_RPATH_REPORT_DIR: ${{ github.workspace }}/reports
        run: pixi run --manifest-path .github/workflows/pixi.toml python -m pytest tests/test_rpath_packages.py -vv
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rpath-conda-${{ matrix.backend }}
          path: reports
