[build-system]
build-backend = 'mesonpy'
requires = ['meson-python', 'setuptools-scm[simple]']

[project]
name = 'version-setuptools-scm'
dynamic = ['version']

[tool.setuptools_scm]
root = '../../..'  # needed because this test package isn't at the root of the repo
